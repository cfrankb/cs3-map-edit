name: Windows Release

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.7.1
  ARTIFACT: CS3MapEdit_Win64
  ARCH: win64_mingw
  HOST: windows

jobs:
  build:
    runs-on: windows-2022 # Use the Windows Server 2022 runner

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get all tags for correct version determination
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --all --tags -f

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ env.HOST }}
          target: desktop
          arch: ${{ env.ARCH }}
          dir: ${{ runner.temp }}
          setup-python: false

      - name: Clean stale build directory
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [ -d build ]; then
            echo "Removing stale build/ to avoid cached config"
            rmdir build
          fi

      #- name: Configure build with CMake
      #  working-directory: ${{ env.SOURCE_DIR }}
      #  run: |
      #    cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCS3_BUILD_ZLIB_FROM_SOURCE=ON

      - name: Locate MinGW compiler bundled with Qt
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          # The bundled MinGW toolchain MUST be used: mixing a Qt-bundled compiler
          # with a different MinGW (e.g. the system C:/mingw64) produces mismatched
          # binaries that fail to link/run. So we only accept a compiler found
          # inside the Qt install tree, never fall back to a system toolchain.
          # runner.temp is a Windows path like D:\a_\temp. Bash turns the \\ into a
          # literal backslash but the \\_ collapses to just \", mangling the path
          # (D:a_temp/Qt), so find traverses nothing. Normalize backslashes to forward
          # slashes so the recursive find can actually reach the Qt install.
          QT_ROOT=$(echo "${{ runner.temp }}/Qt" | tr '\' '/')
          echo "Searching for compilers under: $QT_ROOT"
          GCC=$(find "$QT_ROOT" -type f -name 'gcc.exe' 2>/dev/null | head -n 1)
          GXX=$(find "$QT_ROOT" -type f -name 'g++.exe' 2>/dev/null | head -n 1)
          if [ -z "$GCC" ] || [ -z "$GXX" ]; then
            echo "ERROR: could not locate gcc.exe/g++.exe inside the Qt install at $QT_ROOT" >&2
            echo "Contents of $QT_ROOT:" >&2
            ls -R "$QT_ROOT" 2>/dev/null | head -n 80 >&2
            exit 1
          fi
          echo "GCC=$GCC" >> $GITHUB_ENV
          echo "GXX=$GXX" >> $GITHUB_ENV
          echo "Using Qt-bundled compiler at $GCC and $GXX" >&2

      - name: Configure build with CMake
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          # Force CMake to use the MinGW compiler bundled inside the downloaded Qt directory
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCS3_BUILD_ZLIB_FROM_SOURCE=ON \
            -DCMAKE_C_COMPILER="${{ env.GCC }}" \
            -DCMAKE_CXX_COMPILER="${{ env.GXX }}"

      - name: Build
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cmake --build build

      - name: Deploy Qt runtime
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          windeployqt --pdb --release --no-compiler-runtime --no-translations cs3-map-edit.exe --qmldir=${{ env.SOURCE_DIR }}/src

      - name: Copy zlib DLL to executable root
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          if [ -f zlib/libz.dll ]; then
            cp zlib/libz.dll .
          fi

      - name: Verify the compiler is the Qt-bundled MinGW (not a system toolchain)
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          # The GCC/GXX env vars were set by the "Locate MinGW compiler bundled with Qt"
          # step from inside the Qt install tree. We must NOT re-derive them from PATH
          # here: PATH on windows-2022 also contains a system MinGW (e.g. C:/mingw64).
          # Using a system compiler would mismatch the Qt-bundled qmake/qmake and produce
          # binaries that fail to link/run. So we only accept the compiler already found
          # inside the Qt install, and verify it really lives under the Qt root.
          QT_ROOT=$(echo "${{ runner.temp }}/Qt" | tr '\' '/')
          if [ -z "$GCC" ] || [ -z "$GXX" ]; then
            echo "ERROR: GCC/GXX not set; cannot verify Qt-bundled compiler" >&2
            exit 1
          fi
          case "$GCC" in
            "$QT_ROOT"/*) : ;;  # GCC path is inside the Qt install
            *) echo "ERROR: $GCC is not under $QT_ROOT; refusing to use it" >&2; exit 1 ;;
          esac
          echo "Confirmed GCC=$GCC and GXX=$GXX are inside the Qt install at $QT_ROOT"

      - name: Find MinGW installation (Qt-bundled toolchain)
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          # Derive the MinGW toolchain root from the Qt-bundled compiler path we already
          # validated above. $GCC looks like C:/.../Qt/6.7.1/windows/sdk/mingw64/bin/gcc.exe,
          # so its parent's parent is the mingw64 toolchain directory. We never fall back
          # to a PATH/system MinGW, guaranteeing the runtime DLLs below come from the Qt
          # install that was just downloaded.
          CC_DIR=$(dirname "$GCC")
          MINGW_ROOT=$(dirname "$CC_DIR")
          echo "MINGW_ROOT=$MINGW_ROOT"
          find "$MINGW_ROOT" -type f \( -name 'libgcc_s_seh-1.dll' -o -name 'libwinpthread-1.dll' -o -name 'libstdc++-6.dll' \) > $RUNNER_TEMP/minw_dlls.txt
          cat $RUNNER_TEMP/minw_dlls.txt

      - name: Copy MinGW runtime DLLs to executable root
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          # MinGW C++ runtime libraries required by the executable.
          # windeployqt copies Qt DLLs but not these, so copy them manually.
          # Each DLL is searched for within the MinGW toolchain tree and copied
          # from the first match into the build (executable) root.
          for d in libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll; do
            match=$(grep -F "$d" $RUNNER_TEMP/minw_dlls.txt | head -n 1)
            if [ -n "$match" ]; then
              cp "$match" .
              echo "Copied $d"
            else
              echo "WARNING: $d not found" >&2
            fi
          done

      - name: Stage clean distribution folder
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          # build/ contains CMake/Ninja cruft (CMakeFiles, .ninja_*, _autogen,
          # Desktop_*). windeployqt spreads Qt plugin DLLs across subfolders
          # (platforms/, imageformats/, styles/, ...), so copy them all recursively
          # into a fresh dist/ folder, preserving their relative paths.
          rm -rf dist
          mkdir dist
          cp cs3-map-edit.exe dist/
          # -parents preserves the subfolder structure (platforms/, imageformats/, ...)
          find . -type f -name '*.dll' -not -path './dist/*' -exec cp --parents {} dist/ \;
          # Remove the CMake/Ninja build cruft we don't want in the artifact.
          for d in CMakeFiles Desktop_*-Release zlib; do
            if [ -e "$d" ]; then rm -rf "dist/$d"; fi
          done
          for d in *_autogen .qt .ninja_deps .ninja_log; do
            if [ -e "dist/$d" ]; then rm -rf "dist/$d"; fi
          done
          if [ -f build.ninja ]; then rm -f "dist/build.ninja"; fi
          if compgen -G 'dist/*.cmake' >/dev/null 2>&1; then rm -f dist/*.cmake; fi
          if [ -f dist/cmake_install.cmake ]; then rm -f dist/cmake_install.cmake; fi
          if [ -f dist/CMakeCache.txt ]; then rm -f dist/CMakeCache.txt; fi
          find dist -type f | sort

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LICENSE
            dist/**

      - name: Save build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.SOURCE_DIR }}/build/dist
          retention-days: 7
