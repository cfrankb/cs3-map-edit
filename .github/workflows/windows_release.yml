name: Windows Release

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.7.1
  ARTIFACT: CS3MapEdit_Win64
  ARCH: win64_mingw
  HOST: windows

jobs:
  build:
    runs-on: windows-2022 # Use the Windows Server 2022 runner

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: (2) Get all tags for correct version determination
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --all --tags -f

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ env.HOST }}
          target: desktop
          arch: ${{ env.ARCH }}
          dir: ${{ runner.temp }}
          setup-python: false

      - name: Clean stale build directory
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [ -d build ]; then
            echo "Removing stale build/ to avoid cached config"
            rmdir build
          fi

      - name: Configure build with CMake
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCS3_BUILD_ZLIB_FROM_SOURCE=ON

      - name: Build
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cmake --build build

      - name: Deploy Qt runtime
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          windeployqt --pdb --release --no-compiler-runtime --no-translations cs3-map-edit.exe --qmldir=${{ env.SOURCE_DIR }}/src

      #- name: Compress to zip file
      #  working-directory: ${{ env.SOURCE_DIR }}
      #  run: |
      #    7z a CS3MapEdit_Win64.zip build

      - name: Copy zlib DLL to executable root
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          if [ -f zlib/zlib.dll ]; then
            cp zlib/zlib.dll .
          fi

      - name: Compress to zip file
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          # 7z '*' does not cross directory boundaries, so patterns need the
          # build/ prefix. Exclude both the directory entry and its contents.
          # '**' is used for recursive matching (nested .cmake files).
          7z a CS3MapEdit_Win64.zip build \
            -x!'build/CMakeFiles' \
            -x!'build/CMakeFiles/*' \
            -x!'build/cs3-map-edit_autogen' \
            -x!'build/cs3-map-edit_autogen/*' \
            -x!'build/build.ninja' \
            -x!'build/cmake_install.cmake' \
            -x!'**/*.cmake' \
            -x!'build/zlib' \
            -x!'build/zlib/*'

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LICENSE
            *.zip

      - name: Save build artifact
        uses: actions/upload-artifact@master
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.SOURCE_DIR }}/${{ env.ARTIFACT }}.zip
          retention-days: 7
