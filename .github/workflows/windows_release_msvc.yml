name: Windows Release (MSVC)

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.10.3
  ARTIFACT: CS3MapEdit_Win64_MSVC
  ARCH: win64_msvc2022_64
  HOST: windows

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get all tags for correct version determination
        run: git fetch --all --tags -f

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ env.HOST }}
          target: desktop
          arch: ${{ env.ARCH }}
          dir: ${{ runner.temp }}
          setup-python: false

      - name: Clean stale build directory
        run: |
          if [ -d "build" ]; then
            echo "Removing stale build/ to avoid cached config"
            rm -rf build
          fi

      - name: Configure build with CMake
        run: |
          # The Visual Studio generator is multi-configuration by default. 
          # CMAKE_CONFIGURATION_TYPES=Release restricts it, but output binaries 
          # will still land inside build/Release/.
          cmake -G "Visual Studio 17 2022" -A x64 -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CONFIGURATION_TYPES=Release \
            -DCS3_BUILD_ZLIB_FROM_SOURCE=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        working-directory: ${{ env.SOURCE_DIR }}/build/Release
        run: |
          # Use absolute/corrected paths so windeployqt works seamlessly
          windeployqt --pdb --release --no-compiler-runtime --no-translations cs3-map-edit.exe --qmldir="${{ env.SOURCE_DIR }}/src"

      - name: Copy zlib DLL to executable root
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: cp zlib/Release/libz.dll Release/

      - name: Stage clean distribution folder
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          rm -rf dist
          mkdir dist

          # Copy the compiled executable and its sibling DLLs from Release/
          cp Release/cs3-map-edit.exe dist/

          # Safely copy generated subfolders (platforms, imageformats, etc.) 
          # while filtering out the Visual Studio/CMake intermediate build folders
          find Release/ -maxdepth 1 -mindepth 1 -type d ! -name "CMakeFiles" ! -name "zlib" -exec cp -r {} dist/ \;

          # Copy all DLL files located at the root of the Release directory
          find Release/ -maxdepth 1 -type f -name "*.dll" -exec cp {} dist/ \;

          # Display structured output for confirmation
          find dist -type f | sort

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LICENSE
            build/dist/**

      - name: Save build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.SOURCE_DIR }}/build/dist
          retention-days: 7
