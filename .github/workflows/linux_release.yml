name: Linux Release

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.10.3
  ARTIFACT: "CS3MapEdit-x86_64.AppImage"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          setup-python: false

      - name: Configure build with CMake
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DCS3_BUILD_ZLIB_FROM_SOURCE=ON

      - name: Build
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cmake --build build

      - name: AppImage
        working-directory: ${{ env.SOURCE_DIR }}/build
        run: |
          sudo apt update -y
          sudo apt install libxcb-cursor0
          sudo apt install libfuse2
          wget -O deploy.AppImage https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x deploy.AppImage
          cp ${{ env.SOURCE_DIR }}/linux/CS3MapEdit.desktop .
          cp ${{ env.SOURCE_DIR }}/linux/CS3MapEdit-icon.png .
          ./deploy.AppImage CS3MapEdit.desktop -appimage -no-translations -extra-plugins=renderers
          mkdir -p ${{ env.SOURCE_DIR }}/build/release
          mv CS3MapEdit*.AppImage ${{ env.SOURCE_DIR }}/build/release

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.SOURCE_DIR }}/build/release/*.AppImage
            LICENSE

      - name: Linux artefact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.SOURCE_DIR }}/build/release
          retention-days: 7
